teams:
  PM_Orchestrator:
    role: "Product Manager & Orchestrator"
    description: "The lead orchestrator that ingests user requirements, designs product workflows, and delegates tasks to the specialized engineering subagents. Maintains the roadmap and ensures cross-workspace architectural integrity."
    leverages: 
      - "monorepo-architect"

  Core_App_Engineer:
    role: "Core App Engineer"
    description: "Owns apps/saas end-to-end. Specializes in Next.js 16 Server Components, Server Actions, Drizzle ORM, and Better Auth. Responsible for full-stack feature delivery within the core multi-tenant dashboard."
    leverages: 
      - "server-first-data"
      - "b2b-identity-and-billing"
      - "ai-native-ux"

  Marketing_Growth_Engineer:
    role: "Marketing Growth Engineer"
    description: "Owns apps/marketing end-to-end. Specializes in Next.js 16, Sanity GROQ, Tailwind v4, and Shadcn/ui. Responsible for high-performance, SEO-optimized marketing and landing pages."
    leverages: 
      - "headless-content-modeling"
      - "ai-native-ux"

  AI_Integration_Lead:
    role: "AI Integration Lead"
    description: "Specializes in the Vercel AI SDK, Generative UI, OpenRouter, and Pinecone embeddings. Wires up interactive chat components and RAG search pipelines."
    leverages: 
      - "ai-native-ux"

  CMS_Developer:
    role: "CMS Developer"
    description: "Specializes in Sanity Studio configuration, GROQ querying, and Sanity schema design. Manages apps/studio and wires up the marketing site's content fetching."
    leverages: 
      - "headless-content-modeling"

  Technical_Writer:
    role: "Technical Writer"
    description: "Specializes in Fumadocs MDX documentation, React Email templates, and machine-readable output (AEO). Drafts documentation in apps/docs and transactional emails in apps/mail-preview."
    leverages: 
      - "generative-seo-and-docs"
